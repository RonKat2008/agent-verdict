[project]
name = "agent-verdict"
version = "0.0.1"
description = "Evidence-based completion verifier for Claude Code"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
verdict = "agent_verdict.cli:main"

[dependency-groups]
# mypy 2.0.0 dropped `--python-version 3.9` support ("Python 3.9 is not
# supported (must be 3.10 or higher)"), but task-1-brief requires a second
# `uv run mypy --python-version 3.9 plugin/hooks` invocation to catch typing
# that would be wrong on the 3.9 interpreter the hot path actually runs on.
# 1.20.2 is the newest release that still accepts it, so mypy is capped below
# 2.0 here rather than dropping the 3.9-targeted check.
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11,<2",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_verdict"]

[tool.ruff]
line-length = 100
target-version = "py311"
# pre-commit's local ruff hooks pass staged file paths explicitly (see
# .pre-commit-config.yaml), and ruff ignores `exclude`/`extend-exclude` for
# explicitly-passed paths unless `force-exclude` is set. Needed so the
# generated _redact_rules.py stays excluded (task-2-brief.md) even when it's
# one of the staged files a commit passes to the hook.
force-exclude = true
# ruff 0.16.8's formatter reformats Python code fences embedded in Markdown
# by default (confirmed: `ruff format --check --isolated` on
# docs/superpowers/plans/2026-09-20-m0-foundations.md reformats those fences
# to the isolated default line-length, while the project config's
# line-length = 100 already matches, so `ruff format --check .` reports it
# as already formatted). Documentation must never be rewritten by the
# formatter, so exclude it entirely.
# vendor/ is a verbatim third-party vendor drop (task-2-brief.md) and
# _redact_rules.py is GENERATED (scripts/gen_redact.py): both are excluded
# from lint/format since neither is hand-edited and the generated rules file
# has many lines over the line-length limit by construction.
extend-exclude = ["docs", "vendor", "_redact_rules.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# plugin/hooks must run on the stdlib-only Python 3.9 interpreter bundled with
# macOS (task-1-brief). UP007 rewrites typing.Optional/Union into PEP 604
# `X | Y` syntax even inside cast()/TypeAlias positions that ARE evaluated at
# runtime (not just deferred annotations), and UP038 rewrites
# isinstance(x, (A, B)) into isinstance(x, A | B), which calls type.__or__ and
# raises TypeError on 3.9. Both are 3.10+-only at runtime, so they are disabled
# for the hot tree.
"plugin/hooks/**" = ["UP007", "UP038"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "scripts", "tests", "plugin/hooks"]
exclude = [
    "scripts/fixture_capture_plugin",
    "vendor",
    "_redact_rules\\.py$",
    # A standalone fixture project (task-7-brief.md, G2.4's staged scenario),
    # not part of this package: its own conftest.py/mathlib.py would
    # otherwise collide with tests/unit/conftest.py under mypy's basename
    # module resolution, and its own tests/test_math.py's assertion is
    # deliberately wrong (the scenario's whole point).
    "tests/e2e/scenario_repo",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "plugin/hooks"]
# tests/e2e/scenario_repo is a standalone fixture project for G2.4's staged
# scenario (task-7-brief.md), copied into a temp cwd and run by a real
# `claude -p` session, never by our own suite: its one test is deliberately
# written to fail (add(2, 2) == 5), so it must never be collected here.
addopts = "-q --ignore=tests/e2e/scenario_repo"
markers = [
    "slow: exercises multiple processes and may take several seconds",
]
