[project]
name = "agent-verdict"
version = "0.0.1"
description = "Evidence-based completion verifier for Claude Code"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
verdict = "agent_verdict.cli:main"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_verdict"]

[tool.ruff]
line-length = 100
target-version = "py311"
# ruff 0.16.8's formatter reformats Python code fences embedded in Markdown
# by default (confirmed: `ruff format --check --isolated` on
# docs/superpowers/plans/2026-09-20-m0-foundations.md reformats those fences
# to the isolated default line-length, while the project config's
# line-length = 100 already matches, so `ruff format --check .` reports it
# as already formatted). Documentation must never be rewritten by the
# formatter, so exclude it entirely.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "scripts", "tests"]
exclude = ["scripts/fixture_capture_plugin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-q"
