name: site
on:
  push:
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
      - 'src/agent_verdict/verdict_hot/**'
      - 'plugin/hooks/verdict_hot/**'
      - 'pyproject.toml'
      - 'tests/test_site_*.py'
      - 'tests/fixtures/site/**'
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
      - 'src/agent_verdict/verdict_hot/**'
      - 'plugin/hooks/verdict_hot/**'
      - 'pyproject.toml'
      - 'tests/test_site_*.py'
      - 'tests/fixtures/site/**'
permissions:
  contents: read
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  site:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -e .
        working-directory: .
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run lhci
